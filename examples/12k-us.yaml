# Minimal 12K US inverter config: ESP32-S3 DevKitC with an isolated RS232/RS485 module on GPIO 6 (TX) and 5 (RX).
substitutions:
  modbus_address: "0x01"

esphome:
  name: inverter-0
  friendly_name: Inverter 0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

packages:
  deye:
    url: https://github.com/clowrey/deye-esphome
    ref: v1.0.0
    files:
      - common/rs485-modbus.yaml
      - common/diagnostics.yaml
      - models/12k-us/registers.yaml

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
