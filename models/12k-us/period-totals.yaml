# Month and year PV and load energy kept by the inverter. 12K US only: a Sol-Ark 15K-2P reads 0 for all of these.
# Registers 67 (month grid) and 98-99 (year grid export) are left out: on a 12K US they repeat the load values.
substitutions:
  modbus_controller_id: inverter

sensor:
  - platform: modbus_controller            # 065 Month PV energy
    modbus_controller_id: ${modbus_controller_id}
    name: "Month PV Energy"
    register_type: holding
    address: 65
    unit_of_measurement: "kWh"
    accuracy_decimals: 1
    device_class: energy
    state_class: total_increasing
    value_type: U_WORD
    filters:
      - multiply: 0.1

  - platform: modbus_controller            # 066 Month load energy
    modbus_controller_id: ${modbus_controller_id}
    name: "Month Load Energy"
    register_type: holding
    address: 66
    unit_of_measurement: "kWh"
    accuracy_decimals: 1
    device_class: energy
    state_class: total_increasing
    value_type: U_WORD
    filters:
      - multiply: 0.1

  - platform: modbus_controller            # 068-069 Year PV energy (low word first)
    modbus_controller_id: ${modbus_controller_id}
    name: "Year PV Energy"
    register_type: holding
    address: 68
    unit_of_measurement: "kWh"
    accuracy_decimals: 1
    device_class: energy
    state_class: total_increasing
    value_type: U_DWORD_R
    filters:
      - multiply: 0.1

  - platform: modbus_controller            # 087-088 Year load energy (low word first)
    modbus_controller_id: ${modbus_controller_id}
    name: "Year Load Energy"
    register_type: holding
    address: 87
    unit_of_measurement: "kWh"
    accuracy_decimals: 1
    device_class: energy
    state_class: total_increasing
    value_type: U_DWORD_R
    filters:
      - multiply: 0.1
