# Deye / Sunsynk / Sol-Ark 12K US split-phase hybrid: Modbus registers over RS485/RS232.
# Include with common/rs485-modbus.yaml. Entity names here are fixed on purpose: Home Assistant keys each
# entity's history on the device and its name, so renaming one starts a new entity and drops its history.
# Substitutions used: modbus_controller_id, settings_skipped_updates, battery_current_multiply.
substitutions:
  modbus_controller_id: inverter
  settings_skipped_updates: "30"
  battery_current_multiply: "0.1"


binary_sensor:
  - platform: modbus_controller            # 103 Uses bit flags, 64 separate bits One bit for each fault
    modbus_controller_id: inverter
    name: "Fault GFDI_Relay_Failure"
    register_type: holding
    #register_count: 4 # not supported in binary sensor type - doing it with separate reads is fine anyway
    address: 103
    bitmask: 0x80 #bit 7 = F08 = GFDI_Relay_Failure

  - platform: homeassistant            # Manual Time sync. Create an input_boolean sensor in HA
    entity_id: input_boolean.sync_inverter_time
    name: "Sync Time"
    id: sync_time
    on_press:
      then:
        - lambda: |-
            esphome::modbus_controller::ModbusController *controller = id(inverter);
            time_t now = ::time(nullptr);
            struct tm *time_info = ::localtime(&now);
            int seconds = time_info->tm_sec;
            int minutes = time_info->tm_min;
            int hour = time_info->tm_hour;
            int day = time_info->tm_mday;
            int month = time_info->tm_mon + 1;
            int year = time_info->tm_year;
            year = year + 1900;
            int year1 = year - 2000;
            
            uint16_t reg22_value = (year1 << 8) | month;
            uint16_t reg23_value = (day << 8) | hour;
            uint16_t reg24_value = (minutes << 8) | seconds;
            
            if (year != 1970) {
              std::vector<uint16_t> rtc_data = {reg22_value, reg23_value, reg24_value};
              esphome::modbus_controller::ModbusCommandItem set_rtc_command =
                  esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(controller, 22, rtc_data.size(), rtc_data);
              controller->queue_command(set_rtc_command);
              ESP_LOGI("Time Sync", "Seconds: %d, Minutes: %d, Hour: %d, Day: %d, Month: %d, Year: %d", seconds, minutes, hour, day, month, year);
            }

  - platform: modbus_controller            # 194 Grid Connected Status
    modbus_controller_id: inverter
    name: "Grid Connected Status"
    id: inverter_esphome_grid_connected_status
    register_type: holding
    address: 194

  - platform: modbus_controller           # 280 Gen Peak Shaving Status
    modbus_controller_id: inverter
    name: "Gen Peak Shaving Status"
    id: inverter_esphome_gen_peak_shaving_status
    register_type: holding
    address: 280
    bitmask: 0x10

  - platform: modbus_controller           # 280 Grid Peak Shaving Status
    modbus_controller_id: inverter
    name: "Grid Peak Shaving Status"
    id: inverter_esphome_grid_peak_shaving_status
    register_type: holding
    address: 280
    bitmask: 0x100

  - platform: modbus_controller           # 295 Generator relay status ???
    modbus_controller_id: inverter
    name: "195 Gen Relay State? 0x10"
    id: inverter_esphome_gen_start_relay_status
    register_type: holding
    address: 195
    bitmask: 0x10 # = bit 4

  - platform: modbus_controller           # 295 Generator relay status ???
    modbus_controller_id: inverter
    name: "195 Gen Relay State? 0x1"
    #id: inverter_esphome_gen_start_relay_status
    register_type: holding
    address: 195
    bitmask: 0x1 # = bit 1

  - platform: modbus_controller           # 295 Generator relay status ???
