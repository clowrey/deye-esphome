    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 0.1
    value_type: U_WORD 

  - platform: template                     #  Load power accurate if using generator port with a generator connected as input
    name: "Load Power Calculated"
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement
    lambda: |-
      if (id(inverter_esphome_aux_power).state > 100){
        return (id(inverter_esphome_inverter_power).state + id(inverter_esphome_aux_power).state);
      }
      else{
        return (id(inverter_esphome_inverter_power).state);  
      }
      
    update_interval: 5s

