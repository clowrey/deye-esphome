# RS485/RS232 to the inverter's Modbus port, polling, and an hourly clock sync from Home Assistant.
# Substitutions: tx_pin, rx_pin (ESP GPIOs to the transceiver), modbus_address (the inverter's Modbus ID),
# modbus_turnaround (pause after each reply before the next request), settings_update_interval (how often the
# slow controller reads settings times, firmware versions, fault words and status).
substitutions:
  tx_pin: "6"
  rx_pin: "5"
  modbus_address: "0x01"
  modbus_turnaround: 50ms
  settings_update_interval: 90s

time:
  - platform: homeassistant
    id: homeassistant_time
    # The inverter clock is written only after Home Assistant's time has arrived: right after boot the ESP's own
    # clock can already count as valid but be hours off (seen: 22:37 written at 15:51). Once on the first sync,
    # then hourly (interval below).
    on_time_sync:
      then:
        - lambda: "id(deye_ha_time_ok) = true;"
        - if:
            condition:
              lambda: "return !id(deye_clock_synced);"
            then:
              - script.execute: deye_sync_clock

globals:
  - id: deye_ha_time_ok
    type: bool
    initial_value: "false"
  - id: deye_clock_synced
    type: bool
    initial_value: "false"

uart:
  id: mod_bus
  baud_rate: 9600
  stop_bits: 1
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}

modbus:
  id: inverter_modbus
  # ESPHome 2026 defaults to 600 ms here, which stretches a 3 s poll of ~40 register blocks to well over 20 s.
  # 50 ms is the spacing these inverters ran with for years (the old modbus_controller throttle setting).
  turnaround_time: ${modbus_turnaround}

modbus_controller:
  - id: inverter
    address: ${modbus_address}
    modbus_id: inverter_modbus
    setup_priority: -10
    update_interval: "3s"
  # Second controller on the same inverter for registers that rarely change (replaces skip_updates, which
  # ESPHome 2026 ignores: those registers were read every 3 s).
  - id: inverter_slow
    address: ${modbus_address}
    modbus_id: inverter_modbus
    setup_priority: -10
    update_interval: ${settings_update_interval}

interval:
  - interval: 3600s
    then:
      - script.execute: deye_sync_clock

script:
  - id: deye_sync_clock
    then:
      - lambda: |-
          esphome::modbus_controller::ModbusController *controller = id(inverter);
          // Local time from ESPHome's clock. ESPHome 2026 converts time zones itself and no longer sets the C
          // library's TZ on ESP32, so ::localtime() returns UTC and the inverter would run 10+ hours off.
          if (!id(deye_ha_time_ok)) return;
          auto local = id(homeassistant_time).now();
          if (!local.is_valid()) return;
          int seconds = local.second;
          int minutes = local.minute;
          int hour = local.hour;
          int day = local.day_of_month;
          int month = local.month;
          int year = local.year;
          int year1 = year - 2000;
          
          uint16_t reg22_value = (year1 << 8) | month;
          uint16_t reg23_value = (day << 8) | hour;
          uint16_t reg24_value = (minutes << 8) | seconds;
          
          if (year != 1970) {
            std::vector<uint16_t> rtc_data = {reg22_value, reg23_value, reg24_value};
            esphome::modbus_controller::ModbusCommandItem set_rtc_command =
                esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(controller, 22, rtc_data.size(), rtc_data);
            controller->queue_command(set_rtc_command);
            id(deye_clock_synced) = true;
            ESP_LOGI("Time Sync", "Seconds: %d, Minutes: %d, Hour: %d, Day: %d, Month: %d, Year: %d", seconds, minutes, hour, day, month, year);
          }

############################################### BINARY SENSORS ########################################
